<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>せつやく帳</title>
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="せつやく帳">
<meta name="theme-color" content="#2F6F52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#EEF1EA;
    --paper-raised:#F8F9F4;
    --ink:#20281F;
    --ink-soft:#5B6459;
    --ink-faint:#8B9385;
    --rule:rgba(32,40,31,0.14);
    --rule-strong:rgba(32,40,31,0.26);
    --jade:#2F6F52;
    --jade-strong:#1F5A40;
    --jade-soft:#E1EEE6;
    --gold:#A9791F;
    --stamp:#A23A2E;
    --stamp-ink:#F7E7E4;
    --shadow: 0 1px 2px rgba(32,40,31,0.06), 0 6px 18px -10px rgba(32,40,31,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161912;
      --paper-raised:#1E2219;
      --ink:#ECEFE6;
      --ink-soft:#A2AA97;
      --ink-faint:#6E7566;
      --rule:rgba(236,239,230,0.14);
      --rule-strong:rgba(236,239,230,0.24);
      --jade:#6FBE95;
      --jade-strong:#8FD1AE;
      --jade-soft:rgba(111,190,149,0.16);
      --gold:#D9AE55;
      --stamp:#E0897A;
      --stamp-ink:rgba(224,137,122,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#161912;
    --paper-raised:#1E2219;
    --ink:#ECEFE6;
    --ink-soft:#A2AA97;
    --ink-faint:#6E7566;
    --rule:rgba(236,239,230,0.14);
    --rule-strong:rgba(236,239,230,0.24);
    --jade:#6FBE95;
    --jade-strong:#8FD1AE;
    --jade-soft:rgba(111,190,149,0.16);
    --gold:#D9AE55;
    --stamp:#E0897A;
    --stamp-ink:rgba(224,137,122,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .section-title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 14px;
    color:var(--ink);
    text-wrap:balance;
  }

  /* Cover */
  .cover{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .cover::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(var(--rule) 0 1px, transparent 1px 38px);
    opacity:0.5;
    pointer-events:none;
  }
  .cover-top{position:relative;}
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    font-weight:500;
    margin-bottom:6px;
  }
  .sync-status{
    letter-spacing:0;
    font-size:11px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .cover h1{
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size:clamp(26px,6vw,32px);
    margin:0;
    letter-spacing:0.02em;
  }
  .cover-total{
    position:relative;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--rule-strong);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px 12px;
  }
  .cover-total-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .cover-total-value{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(30px,8vw,40px);
    color:var(--jade-strong);
    line-height:1;
  }
  .yen{font-size:0.62em; margin-right:2px; opacity:0.85;}

  /* Stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .stat-label{
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .stat-value{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(16px,4.2vw,20px);
    color:var(--ink);
  }
  .stat-unit{font-size:12px; color:var(--ink-soft); margin-left:2px; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:500;}

  /* Chart */
  .chart-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:18px 18px 14px;
    box-shadow:var(--shadow);
  }
  #chart{width:100%; height:auto; display:block; overflow:visible;}
  .bar{fill:var(--jade); opacity:0.85;}
  .bar.current{opacity:1;}
  .bar-label{fill:var(--ink-soft); font-size:11px; font-family:"Zen Kaku Gothic New",sans-serif;}
  .bar-value{fill:var(--ink); font-size:11px; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700;}
  .axis-line{stroke:var(--rule-strong); stroke-width:1;}

  /* Form */
  .entry-form-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:20px 20px 22px;
    box-shadow:var(--shadow);
  }
  #entryForm{display:flex; flex-direction:column; gap:14px;}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:6px; flex:1 1 140px;}
  .field label{font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .field input[type="date"],
  .field input[type="text"],
  .field input[type="number"]{
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule-strong);
    border-radius:8px;
    padding:9px 11px;
    width:100%;
  }
  .field input:focus-visible{
    outline:2px solid var(--jade);
    outline-offset:1px;
  }
  .amount-input{
    display:flex;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--rule-strong);
    border-radius:8px;
    padding:0 11px;
  }
  .amount-input .yen{color:var(--ink-soft); font-size:15px;}
  .amount-input input{border:none; background:transparent; padding:9px 0 9px 6px;}
  .amount-input input:focus-visible{outline:none;}
  .amount-input:focus-within{outline:2px solid var(--jade); outline-offset:1px;}

  .category-pills{display:flex; flex-wrap:wrap; gap:8px;}
  .pill{
    font:inherit;
    font-size:13px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--rule-strong);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .pill[aria-checked="true"]{
    background:var(--jade-soft);
    border-color:var(--jade);
    color:var(--jade-strong);
    font-weight:700;
  }
  .pill:focus-visible{outline:2px solid var(--jade); outline-offset:2px;}

  .field-error{
    color:var(--stamp);
    font-size:12.5px;
    margin:0;
  }

  .stamp-btn{
    align-self:center;
    margin-top:4px;
    width:76px;
    height:76px;
    border-radius:50%;
    border:2.5px solid var(--stamp);
    background:var(--stamp-ink);
    color:var(--stamp);
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.08em;
    cursor:pointer;
    transition: transform 0.15s ease;
  }
  .stamp-btn:hover{transform:scale(1.04) rotate(-2deg);}
  .stamp-btn:active{transform:scale(0.96) rotate(1deg);}
  .stamp-btn:focus-visible{outline:2px solid var(--jade); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    .stamp-btn{transition:none;}
    .stamp-btn:hover, .stamp-btn:active{transform:none;}
  }

  /* Ledger list */
  .month-group{margin-bottom:18px;}
  .month-group:last-child{margin-bottom:0;}
  .month-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 2px 8px;
    border-bottom:1px solid var(--rule-strong);
    margin-bottom:2px;
  }
  .month-header h3{
    font-family:"Shippori Mincho",serif;
    font-size:14.5px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .month-header .month-subtotal{
    font-size:13px;
    color:var(--jade-strong);
    font-weight:700;
  }
  .entry-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 2px;
    border-bottom:1px solid var(--rule);
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-day{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    width:38px;
    flex:none;
  }
  .entry-main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .entry-memo{
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-memo.is-empty{color:var(--ink-faint); font-style:normal;}
  .entry-category{
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:999px;
    padding:2px 8px;
    align-self:flex-start;
  }
  .entry-amount{
    font-weight:700;
    color:var(--jade-strong);
    font-size:15px;
    flex:none;
    white-space:nowrap;
  }
  .entry-delete{
    flex:none;
    border:none;
    background:transparent;
    color:var(--ink-faint);
    font-size:12px;
    cursor:pointer;
    padding:6px 4px;
    border-radius:6px;
  }
  .entry-delete:hover{color:var(--stamp);}
  .entry-delete.confirming{color:var(--stamp); font-weight:700;}
  .entry-delete:focus-visible{outline:2px solid var(--jade); outline-offset:2px;}

  .ledger-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .clear-all{border:1px solid var(--rule-strong);background:transparent;color:var(--ink-soft);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer;}
  .clear-all:hover,.clear-all.confirming{color:var(--stamp);border-color:var(--stamp);}
  .clear-all.confirming{font-weight:700;}
  .clear-all:focus-visible{outline:2px solid var(--jade);outline-offset:2px;}
  .ledger-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:24px 10px;
    border:1px dashed var(--rule-strong);
    border-radius:12px;
  }
</style>
</head>
<body>
<div class="page">
  <header class="cover">
    <div class="cover-top">
      <span class="eyebrow">MY SAVINGS LEDGER<span class="sync-status">この端末に保存</span></span>
      <h1>せつやく帳</h1>
    </div>
    <div class="cover-total">
      <span class="cover-total-label">これまでの節約合計</span>
      <span class="cover-total-value"><span class="yen">¥</span><span id="grandTotal">0</span></span>
    </div>
  </header>

  <section class="stats" aria-label="集計">
    <div class="stat">
      <span class="stat-label">今月の節約</span>
      <span class="stat-value">¥<span id="monthTotal">0</span></span>
    </div>
    <div class="stat">
      <span class="stat-label">今年の節約</span>
      <span class="stat-value">¥<span id="yearTotal">0</span></span>
    </div>
    <div class="stat">
      <span class="stat-label">記録件数</span>
      <span class="stat-value"><span id="entryCount">0</span><span class="stat-unit">件</span></span>
    </div>
  </section>

  <section class="chart-card" aria-label="月別の推移">
    <h2 class="section-title">月別の推移（過去6か月）</h2>
    <svg id="chart" viewBox="0 0 600 190" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <section class="entry-form-card" aria-label="節約を記録する">
    <h2 class="section-title">今日の節約を記録する</h2>
    <form id="entryForm" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="fDate">日付</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field field-amount">
          <label for="fAmount">節約額</label>
          <div class="amount-input"><span class="yen">¥</span><input type="number" id="fAmount" inputmode="numeric" min="1" step="1" placeholder="500" required></div>
        </div>
      </div>
      <div class="field">
        <label for="fMemo">メモ</label>
        <input type="text" id="fMemo" placeholder="例：コンビニのコーヒーを我慢した" maxlength="60">
      </div>
      <div class="field">
        <label id="categoryLabel">カテゴリ</label>
        <div class="category-pills" id="categoryPills" role="radiogroup" aria-labelledby="categoryLabel"></div>
      </div>
      <p class="field-error" id="formError" hidden></p>
      <button type="submit" class="stamp-btn" aria-label="記録する"><span>記</span></button>
    </form>
  </section>

  <section class="ledger" aria-label="記録一覧">
    <div class="ledger-head"><h2 class="section-title">記録一覧</h2><button type="button" class="clear-all" id="clearAll" hidden>すべて削除</button></div>
    <div id="ledgerList"></div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "setsuyakucho_entries_v1";
  var CATEGORIES = ["外食を我慢","セール・割引","ポイント利用","自炊・弁当","サブスク見直し","その他"];

  function toDateStr(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function ymOf(dateStr){ return dateStr.slice(0,7); }
  function uid(){ return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function loadEntries(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveEntries(list){
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  }

  var entries = loadEntries();

  var els = {
    grandTotal: document.getElementById("grandTotal"),
    monthTotal: document.getElementById("monthTotal"),
    yearTotal: document.getElementById("yearTotal"),
    entryCount: document.getElementById("entryCount"),
    chart: document.getElementById("chart"),
    ledgerList: document.getElementById("ledgerList"),
    form: document.getElementById("entryForm"),
    fDate: document.getElementById("fDate"),
    fAmount: document.getElementById("fAmount"),
    fMemo: document.getElementById("fMemo"),
    categoryPills: document.getElementById("categoryPills"),
    formError: document.getElementById("formError"),
    clearAll: document.getElementById("clearAll")
  };

  var selectedCategory = CATEGORIES[0];

  function buildPills(){
    els.categoryPills.innerHTML = "";
    CATEGORIES.forEach(function(cat){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pill";
      btn.setAttribute("role","radio");
      btn.setAttribute("aria-checked", cat === selectedCategory ? "true" : "false");
      btn.textContent = cat;
      btn.addEventListener("click", function(){
        selectedCategory = cat;
        Array.prototype.forEach.call(els.categoryPills.children, function(c){
          c.setAttribute("aria-checked", c === btn ? "true" : "false");
        });
      });
      els.categoryPills.appendChild(btn);
    });
  }

  function fmtYen(n){ return Math.round(n).toLocaleString("ja-JP"); }

  function render(){
    var now = new Date();
    var curYm = toDateStr(now).slice(0,7);
    var curYear = String(now.getFullYear());

    var grand = 0, monthSum = 0, yearSum = 0;
    entries.forEach(function(e){
      grand += e.amount;
      if(ymOf(e.date) === curYm) monthSum += e.amount;
      if(e.date.slice(0,4) === curYear) yearSum += e.amount;
    });

    els.grandTotal.textContent = fmtYen(grand);
    els.monthTotal.textContent = fmtYen(monthSum);
    els.yearTotal.textContent = fmtYen(yearSum);
    els.entryCount.textContent = entries.length;

    renderChart();
    renderList();
    els.clearAll.hidden = entries.length === 0;
  }

  function renderChart(){
    var months = [];
    var now = new Date();
    for(var i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ ym: toDateStr(d).slice(0,7), label:(d.getMonth()+1)+"月", total:0 });
    }
    entries.forEach(function(e){
      var ym = ymOf(e.date);
      var m = months.find(function(x){ return x.ym === ym; });
      if(m) m.total += e.amount;
    });

    var max = Math.max.apply(null, months.map(function(m){return m.total;}).concat([1]));
    var W=600,H=190, padL=8, padR=8, baseY=150, top=22, barGap=14;
    var n=months.length;
    var barW = (W - padL - padR - barGap*(n-1)) / n;

    var svg = "";
    svg += '<line class="axis-line" x1="'+padL+'" y1="'+baseY+'" x2="'+(W-padR)+'" y2="'+baseY+'"></line>';
    months.forEach(function(m,i){
      var x = padL + i*(barW+barGap);
      var h = m.total > 0 ? Math.max(4, (m.total/max) * (baseY-top)) : 0;
      var y = baseY - h;
      var isCurrent = i === n-1;
      svg += '<rect class="bar'+(isCurrent?' current':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4"></rect>';
      if(m.total > 0){
        svg += '<text class="bar-value" x="'+(x+barW/2).toFixed(1)+'" y="'+(y-8).toFixed(1)+'" text-anchor="middle">'+fmtYen(m.total)+'</text>';
      }
      svg += '<text class="bar-label" x="'+(x+barW/2).toFixed(1)+'" y="'+(baseY+18)+'" text-anchor="middle">'+m.label+'</text>';
    });

    els.chart.innerHTML = svg;
  }

  function renderList(){
    els.ledgerList.innerHTML = "";
    if(entries.length === 0){
      var empty = document.createElement("div");
      empty.className = "ledger-empty";
      empty.textContent = "まだ記録がありません。上のフォームから最初の節約を記録しましょう。";
      els.ledgerList.appendChild(empty);
      return;
    }

    var sorted = entries.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return 0;
    });

    var groups = [];
    var byYm = {};
    sorted.forEach(function(e){
      var ym = ymOf(e.date);
      if(!byYm[ym]){
        byYm[ym] = { ym: ym, items: [], subtotal: 0 };
        groups.push(byYm[ym]);
      }
      byYm[ym].items.push(e);
      byYm[ym].subtotal += e.amount;
    });

    groups.forEach(function(g){
      var parts = g.ym.split("-");
      var groupEl = document.createElement("div");
      groupEl.className = "month-group";

      var header = document.createElement("div");
      header.className = "month-header";
      header.innerHTML = '<h3>'+parts[0]+'年'+parseInt(parts[1],10)+'月</h3><span class="month-subtotal">¥'+fmtYen(g.subtotal)+'</span>';
      groupEl.appendChild(header);

      g.items.forEach(function(e){
        var row = document.createElement("div");
        row.className = "entry-row";
        var day = parseInt(e.date.split("-")[2],10);

        var memoHtml = e.memo ? escapeHtml(e.memo) : '<span class="is-empty">メモなし</span>';

        row.innerHTML =
          '<span class="entry-day">'+day+'日</span>'+
          '<span class="entry-main">'+
            '<span class="entry-memo">'+memoHtml+'</span>'+
            '<span class="entry-category">'+escapeHtml(e.category||"その他")+'</span>'+
          '</span>'+
          '<span class="entry-amount">¥'+fmtYen(e.amount)+'</span>'+
          '<button type="button" class="entry-delete" data-id="'+e.id+'">削除</button>';
        groupEl.appendChild(row);
      });

      els.ledgerList.appendChild(groupEl);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  els.ledgerList.addEventListener("click", function(ev){
    var btn = ev.target.closest(".entry-delete");
    if(!btn) return;
    var id = btn.dataset.id;
    if(btn.classList.contains("confirming")){
      entries = entries.filter(function(e){ return e.id !== id; });
      saveEntries(entries);
      render();
    } else {
      btn.classList.add("confirming");
      btn.textContent = "本当に削除？";
      setTimeout(function(){
        btn.classList.remove("confirming");
        btn.textContent = "削除";
      }, 3000);
    }
  });

  var clearTimer = null;
  els.clearAll.addEventListener("click", function(){
    var btn = els.clearAll;
    if(!btn.classList.contains("confirming")){
      btn.classList.add("confirming");
      btn.textContent = "本当にすべて削除？";
      clearTimer = setTimeout(function(){ btn.classList.remove("confirming"); btn.textContent = "すべて削除"; }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    btn.classList.remove("confirming");
    btn.textContent = "すべて削除";
    entries = [];
    saveEntries(entries);
    render();
  });

  els.form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var date = els.fDate.value;
    var amount = parseFloat(els.fAmount.value);
    var memo = els.fMemo.value.trim();

    if(!date || !amount || amount <= 0){
      els.formError.hidden = false;
      els.formError.textContent = "日付と節約額（1円以上）を入力してください。";
      return;
    }
    els.formError.hidden = true;

    entries.push({ id: uid(), date: date, amount: Math.round(amount), memo: memo, category: selectedCategory });
    saveEntries(entries);

    els.fAmount.value = "";
    els.fMemo.value = "";
    els.fDate.value = toDateStr(new Date());

    render();
  });

  buildPills();
  els.fDate.value = toDateStr(new Date());
  render();
})();
</script>
</body>
</html>
